<!DOCTYPE html>
<html>

<head>
    <title>Tractus-X Telecare Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <h1>Tractus-X Semantic Data Space Demonstrator</h1>

    <p class="subtitle">
        Semantic interoperability demonstration based on
        Tractus-X concepts and HL7 FHIR transformation.
    </p>

    <button onclick="generateScenario()">
    Generate Mixed Risk Scenario
    </button>

    <div class="pipeline">

        <div class="step">
            Synthetic Event
        </div>

        <div class="arrow">→</div>

        <div class="step">
            Semantic Enrichment
        </div>

        <div class="arrow">→</div>

        <div class="step">
            FHIR Transformation
        </div>

        <div class="arrow">→</div>

        <div class="step">
            Derived Asset
        </div>

    </div>

    <h2>Case Overview</h2>

    <div id="case-overview"></div>

    <div id="summary"></div>

    <div class="container">

        <div class="column">

            <h2>Semantic Events</h2>

            <div id="semantic-events"></div>

        </div>

        <div class="column">

            <h2>FHIR Representation</h2>

            <div id="fhir-events"></div>

        </div>

        <div class="column">

            <h2>Derived Assets</h2>

            <div id="results"></div>

        </div>

    </div>

     <script src="/static/js/app.js"></script>
</body>

</html>
